name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [cli-ide, file-manager, server-manager, tools]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.24.2'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'gofmt가 필요한 파일:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        env:
          GOTOOLCHAIN: local
        run: go vet ./...
      - name: Test
        env:
          GOTOOLCHAIN: local
        run: go test ./...
      - name: Vet for Galaxy Tab (linux/arm64)
        env:
          GOTOOLCHAIN: local
          GOARCH: arm64
        run: go vet ./...

  android-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run WebAddress tests
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          javac -encoding UTF-8 -d "$out" terminal/WebAddress.java terminal/WebAddressTest.java
          java -ea -cp "$out" dev.galaxy.terminal.WebAddressTest
