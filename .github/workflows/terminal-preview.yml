name: Publish Galaxy Terminal preview

on:
  push:
    tags:
      - 'terminal-v*-preview.*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Build and verify Android preview
        env:
          GALAXY_PREVIEW: '1'
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.GALAXY_PREVIEW_KEYSTORE_BASE64 }}
          GALAXY_SIGNING_PASSWORD: ${{ secrets.GALAXY_PREVIEW_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          npm --prefix terminal ci --ignore-scripts
          export GALAXY_TERMINAL_VERSION="${GITHUB_REF_NAME#terminal-v}"
          if [[ -n "$PREVIEW_KEYSTORE_BASE64" ]]; then
            umask 077
            export GALAXY_SIGNING_KEYSTORE="$RUNNER_TEMP/terminal-preview.jks"
            export GALAXY_SIGNING_ALIAS=terminal-preview
            trap 'rm -f -- "$GALAXY_SIGNING_KEYSTORE"' EXIT
            printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$GALAXY_SIGNING_KEYSTORE"
          fi
          bash terminal/build.sh
      - name: Build Galaxy tools and checksums
        run: |
          bash tools/build.sh arm64
          cd dist
          sha256sum Galaxy-Terminal-Preview.apk galaxy-files-linux-arm64 galaxy-servers-linux-arm64 galaxy-tools-LICENSES.txt > SHA256SUMS.txt
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "Galaxy Terminal ${GITHUB_REF_NAME#terminal-v}" \
            --notes '파일 관리자(galaxy-files), 서버 실행 관리자(galaxy-servers), Android 파일 전송을 추가했습니다. Galaxy Terminal Preview는 별도 앱으로 설치되며 기존 Galaxy Terminal의 Ubuntu 데이터를 공유하지 않습니다. ARM64 Galaxy 도구는 기존 Galaxy Terminal의 Ubuntu에서도 실행할 수 있습니다.' \
            dist/Galaxy-Terminal-Preview.apk dist/galaxy-files-linux-arm64 dist/galaxy-servers-linux-arm64 \
            dist/galaxy-tools-LICENSES.txt dist/SHA256SUMS.txt
