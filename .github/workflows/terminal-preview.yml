name: Publish Galaxy Terminal preview

on:
  push:
    tags:
      - 'terminal-v*-preview.*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Android SDK packages
        run: |
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/galaxy-android-sdk"
          bash terminal/setup-android-sdk.sh
          printf 'ANDROID_SDK_ROOT=%s\n' "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Build and verify Android preview
        env:
          GALAXY_PREVIEW: '1'
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.GALAXY_PREVIEW_KEYSTORE_BASE64 }}
          GALAXY_SIGNING_PASSWORD: ${{ secrets.GALAXY_PREVIEW_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          npm --prefix terminal ci --ignore-scripts
          export GALAXY_TERMINAL_VERSION="${GITHUB_REF_NAME#terminal-v}"
          if [[ -n "$PREVIEW_KEYSTORE_BASE64" ]]; then
            umask 077
            export GALAXY_SIGNING_KEYSTORE="$RUNNER_TEMP/terminal-preview.jks"
            export GALAXY_SIGNING_ALIAS=terminal-preview
            trap 'rm -f -- "$GALAXY_SIGNING_KEYSTORE"' EXIT
            printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$GALAXY_SIGNING_KEYSTORE"
          fi
          bash terminal/build.sh
      - name: Checksum the APK
        run: |
          cd dist
          sha256sum Galaxy-Terminal-Preview.apk > SHA256SUMS
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "Galaxy Terminal ${GITHUB_REF_NAME#terminal-v}" \
            --notes 'Galaxy Terminal Preview는 별도 앱으로 설치되며 기존 Galaxy Terminal의 Ubuntu 데이터를 공유하지 않습니다. Ubuntu 도구는 [파일 관리자](https://github.com/qqqqdh/Galaxy/tree/main/file-manager)와 [서버 실행 관리자](https://github.com/qqqqdh/Galaxy/tree/main/server-manager)의 릴리스에서 각각 받을 수 있습니다.' \
            dist/Galaxy-Terminal-Preview.apk dist/SHA256SUMS
